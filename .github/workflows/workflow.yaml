name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  RUST_VERSION: 1.86.0           # Must match rust-toolchain.toml
  CARGO_TERM_COLOR: always
  TERM: xterm-256color
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 — SHA-pinned; tags are mutable (CVE-2025-30066)

      - name: Restore cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4 — SHA-pinned; tags are mutable (CVE-2025-30066)
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            target
          key: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-cargo-${{ hashFiles('**/Cargo.lock') }}-1

      - name: Install Rust
        run: |
          rustup update $RUST_VERSION --no-self-update
          rustup default $RUST_VERSION

      - name: Build
        run: ./verify.sh build

      - name: Upload binary
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 — SHA-pinned; tags are mutable (CVE-2025-30066)
        with:
          name: keepsorted-linux
          path: target/release/keepsorted

  test:
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 — SHA-pinned; tags are mutable (CVE-2025-30066)
        with:
          lfs: true

      - name: Restore cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4 — SHA-pinned; tags are mutable (CVE-2025-30066)
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            target
          key: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-cargo-${{ hashFiles('**/Cargo.lock') }}-1

      - name: Install Rust
        run: |
          rustup update $RUST_VERSION --no-self-update
          rustup default $RUST_VERSION

      - name: Run Tests
        run: ./verify.sh test-release

  clippy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 — SHA-pinned; tags are mutable (CVE-2025-30066)

      - name: Restore cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4 — SHA-pinned; tags are mutable (CVE-2025-30066)
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            target
          key: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-cargo-${{ hashFiles('**/Cargo.lock') }}-1

      - name: Install Rust + Clippy
        run: |
          rustup update $RUST_VERSION --no-self-update
          rustup default $RUST_VERSION
          rustup component add clippy

      - name: Run Clippy
        run: ./verify.sh clippy

  rustfmt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 — SHA-pinned; tags are mutable (CVE-2025-30066)

      - name: Install Rust + Rustfmt
        run: |
          rustup update $RUST_VERSION --no-self-update
          rustup default $RUST_VERSION
          rustup component add rustfmt

      - name: Run rustfmt
        run: ./verify.sh fmt

  keepsorted:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 — SHA-pinned; tags are mutable (CVE-2025-30066)
        with:
          lfs: true

      - name: Download binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 — SHA-pinned; tags are mutable (CVE-2025-30066)
        with:
          name: keepsorted-linux
          path: target/release

      - name: Mark binary executable
        run: chmod +x target/release/keepsorted

      - name: Run KeepSorted
        shell: bash
        run: ./verify.sh keepsorted

      - name: Git Diff
        # Check if keepsorted changed any files.
        run: git diff --exit-code

  e2e-tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 — SHA-pinned; tags are mutable (CVE-2025-30066)
        with:
          lfs: true

      - name: Download binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 — SHA-pinned; tags are mutable (CVE-2025-30066)
        with:
          name: keepsorted-linux
          path: target/release

      - name: Mark binary executable
        run: chmod +x target/release/keepsorted

      - name: Install Bats
        run: sudo apt-get install -y bats

      - name: Run e2e tests
        run: ./verify.sh e2e

  shell-checks:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 — SHA-pinned; tags are mutable (CVE-2025-30066)

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master — SHA-pinned; tags are mutable (CVE-2025-30066)
        env:
          SHELLCHECK_OPTS: -e SC1090 -e SC2119 -e SC1091
